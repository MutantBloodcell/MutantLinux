name: Build & Publish MutantLinux ISO & UEFI Virtual Disk

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build Target (all, qcow2, or iso)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - qcow2
          - iso

permissions:
  contents: write

jobs:
  build-qcow2:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'qcow2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MutantLinux
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Disk Build Tools & ARM64 systemd-boot EFI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosfstools e2fsprogs qemu-utils gdisk curl binutils zstd xz-utils
          mkdir -p /tmp/efi-pkg
          cd /tmp/efi-pkg
          DEB_URL=$(curl -sL "http://deb.debian.org/debian/dists/bookworm/main/binary-arm64/Packages.xz" | xzcat | awk '/^Package: systemd-boot-efi$/,/^Filename:/ {if ($1=="Filename:") print "http://deb.debian.org/debian/"$2}' | head -n 1)
          curl -sL "$DEB_URL" -o systemd-boot-efi.deb
          ar x systemd-boot-efi.deb
          tar -xf data.tar.*
          cp usr/lib/systemd/boot/efi/systemd-bootaa64.efi /tmp/systemd-bootaa64.efi

      - name: Build Universal UEFI GPT Virtual Disk (qcow2)
        run: |
          mkdir -p build/p1 build/p2
          ln -sf /init rootfs/sbin/init

          ROOTFS_MB=$(du -sm rootfs | awk '{print $1}')
          EXT4_MB=$((ROOTFS_MB * 2 + 512))
          DISK_MB=$((EXT4_MB + 132))
          ROOT_PARTUUID="11111111-2222-3333-4444-555555555552"
          CMDLINE="rw root=/dev/vda2 rootfstype=ext4 rootwait init=/init console=ttyAMA0 console=tty0 mitigations=off"

          # 1. Create Sparse GPT Disk With Fixed PARTUUID
          truncate -s "${DISK_MB}M" build/disk.raw
          sgdisk --clear \
            --new=1:2048:+128M --typecode=1:EF00 --change-name=1:"MUTANTEFI" \
            --new=2:0:0 --typecode=2:8300 --change-name=2:"MUTANTROOT" --partition-guid=2:"${ROOT_PARTUUID}" \
            build/disk.raw >/dev/null

          LOOP=$(sudo losetup -P --find --show build/disk.raw)
          sudo mkfs.vfat -F 32 -n "MUTANTEFI" "${LOOP}p1" >/dev/null

          # 2. Populate FAT32 EFI Partition (p1) With Genuine systemd-bootaa64.efi
          sudo mount "${LOOP}p1" build/p1
          sudo mkdir -p build/p1/EFI/BOOT build/p1/loader/entries
          sudo cp /tmp/systemd-bootaa64.efi build/p1/EFI/BOOT/BOOTAA64.EFI
          sudo cp kernel-bin/vmlinuz-mutant build/p1/vmlinuz-mutant

          sudo tee build/p1/loader/loader.conf >/dev/null << 'LCONF'
          default mutant.conf
          timeout 0
          LCONF

          sudo tee build/p1/loader/entries/mutant.conf >/dev/null << MCONF
          title   MutantLinux 1.0 ARM64
          linux   /vmlinuz-mutant
          options ${CMDLINE}
          MCONF

          sudo umount build/p1

          # 3. Repair Linux Symlinks & Populate Partition 2 via mkfs.ext4 -d
          mkdir -p rootfs/dev rootfs/proc rootfs/sys rootfs/tmp rootfs/run rootfs/bin rootfs/sbin rootfs/lib
          rm -f rootfs/bin/sh rootfs/sbin/init
          ln -s busybox rootfs/bin/sh
          ln -s /init rootfs/sbin/init
          ln -sf ld-musl-aarch64.so.1 rootfs/lib/libc.musl-aarch64.so.1
          chmod 755 rootfs/init rootfs/bin/busybox rootfs/lib/ld-musl-aarch64.so.1
          sed -i 's/\r$//' rootfs/init
          sudo mkfs.ext4 -F -N 1000000 -L "MUTANTROOT" -d rootfs "${LOOP}p2" >/dev/null
          sudo losetup -d "$LOOP"

          # 4. Convert to Compressed qcow2
          qemu-img convert -c -f raw -O qcow2 build/disk.raw MutantLinux-arm64.qcow2
          rm -rf build /tmp/efi-pkg /tmp/systemd-bootaa64.efi

      - name: Publish Universal UEFI qcow2 to GitHub Release v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: MutantLinux 1.0 ARM64
          files: MutantLinux-arm64.qcow2

  build-iso:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'iso'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MutantLinux
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install ISO Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpio pigz xorriso dosfstools mtools

      - name: Build Full Bootable UEFI ISO
        run: |
          mkdir -p iso/boot
          ln -sf /init rootfs/sbin/init
          (cd rootfs && find . -print0 | cpio --null -o --format=newc --owner=0:0 2>/dev/null | pigz -6 > ../iso/boot/initramfs.img)
          cp kernel-bin/vmlinuz-mutant iso/boot/
          dd if=/dev/zero of=iso/efiboot.img bs=1M count=96 status=none
          mkfs.vfat iso/efiboot.img >/dev/null
          mmd -i iso/efiboot.img ::/EFI ::/EFI/BOOT
          mcopy -i iso/efiboot.img kernel-bin/BOOTAA64.EFI ::/EFI/BOOT/BOOTAA64.EFI
          xorriso -as mkisofs \
            -o MutantLinux-arm64.iso \
            -V "MUTANTLINUX" \
            -e efiboot.img \
            -no-emul-boot \
            -append_partition 2 0xef iso/efiboot.img \
            iso/
          rm -rf iso

      - name: Publish Full Bootable ISO to GitHub Release v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: MutantLinux 1.0 ARM64
          files: MutantLinux-arm64.iso
